<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Zara Zayan – Happy Birthday 💋</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #1a000d, #000d1a);
      color: #ffffff;
      min-height: 100vh;
      text-align: center;
      overflow-x: hidden;
    }
    #intro, #main { 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      padding: 20px; 
    }
    /* Hidden class fix */
    .hidden { display: none !important; }
    
    h1 { font-size: 2.5rem; color: #ff4081; margin-bottom: 20px; }
    button {
      padding: 15px 30px;
      font-size: 1.2rem;
      background: #d500f9;
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      margin: 10px;
      box-shadow: 0 5px 15px rgba(213, 0, 249, 0.4);
    }
    .kiss-center img {
      width: 100%; max-width: 400px; border-radius: 15px;
      box-shadow: 0 0 30px #ff1744;
    }
    .emoji-item {
      position: fixed; top: -50px; z-index: 9999;
      font-size: 2.5rem; animation: fall linear forwards;
    }
    @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
    
    #gift-box, #poem-box {
      margin-top: 20px; padding: 20px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 15px; display: none;
    }
  </style>
</head>
<body>

<div id="intro">
  <h1>Aankhein band kar jaan... 🙈</h1>
  <p style="font-size: 1.3rem; margin-bottom: 20px;">Ek pyaara sa surprise tera intezaar kar raha hai.</p>
  <button onclick="revealNow()">Ab Open Karo! ✨</button>
</div>

<div id="main" class="hidden">
  <h1>Happy Birthday Zara Zayan! 💖</h1>
  
  <div class="kiss-center">
    <img src="https://gifdb.com/images/high/lovers-passionate-kissing-at-the-beach-8bvjr22odlh1fj31.gif" alt="Birthday Kiss">
  </div>

  <div style="margin: 20px 0;">
    <button onclick="rain('💋')">Send Kiss 💋</button>
    <button onclick="rain('❤️')">Send Love ❤️</button>
  </div>

  <p id="msg" style="height: 30px; color: #ff80ab; font-weight: bold;"></p>

  <button onclick="show('gift-box')" style="background:#c2185b;">My Gift 🎁</button>
  <button onclick="show('poem-box')" style="background:#c2185b;">My Poem 📜</button>

  <div id="gift-box">
    <p>🎂 Yeh Chocolate Cake aur Infinity Love sirf tumhare liye! 🍫🌹💞</p>
  </div>

  <div id="poem-box">
    <p>Meri Zara Zayan, janamdin mubarak ho!<br>
    Tu meri jaan hai, meri duniya, mera sansaar. 💕</p>
  </div>
</div>

<script>
// Yeh function intro ko hide karega aur main content dikhayega
function revealNow() {
  console.log("Button Clicked!"); // Check karne ke liye
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('main').classList.remove('hidden');
  
  // Confetti effect on start
  confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
}

function rain(emoji) {
  document.getElementById('msg').textContent = "Bhej diya... " + emoji;
  for (let i = 0; i < 20; i++) {
    const e = document.createElement('div');
    e.className = 'emoji-item';
    e.textContent = emoji;
    e.style.left = Math.random() * 100 + 'vw';
    e.style.animationDuration = (Math.random() * 2 + 2) + 's';
    document.body.appendChild(e);
    setTimeout(() => e.remove(), 4000);
  }
}

function show(id) {
  const target = document.getElementById(id);
  target.style.display = (target.style.display === 'block') ? 'none' : 'block';
}
</script>

</body>
</html>
